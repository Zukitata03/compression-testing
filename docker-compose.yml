services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ct
      POSTGRES_PASSWORD: ct
      POSTGRES_DB: compression
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ct -d compression"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: ctminio
      MINIO_ROOT_PASSWORD: ctminio-secret
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: node dist/api.js
    env_file: .env
    ports:
      # Match the cloudreve-extend pattern: bind only to the LAN and Tailscale
      # IPs so the API is reachable on the private network, not the internet.
      - "${LAN_IP:?LAN_IP must be set in .env}:3000:3000"
      - "${TAILSCALE_IP:?TAILSCALE_IP must be set in .env}:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build: .
    command: node dist/worker.js
    env_file: .env
    shm_size: 1gb
    # Hard ceiling per container. cpus=2 + FFMPEG_THREADS=4 keeps encodes
    # productive while the rest of the machine serves other services.
    # Raise/lower via WORKER_CPUS in .env; comment out for unlimited.
    cpus: "${WORKER_CPUS:-2}"
    volumes:
      - workertmp:/tmp
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  workertmp:
